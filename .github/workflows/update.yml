name: Жители острова

# Каждые 15 минут собирает комменты Instagram, обновляет жителей, пожелания и голосования.
# Работает на серверах GitHub — компьютер не нужен. Запустить вручную: Actions → «Жители острова» → Run workflow.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: residents
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать жителей из комментов
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID || '17841417700837854' }}
          DM_INVITE: ${{ vars.DM_INVITE }}
          OSTROV_SITE_DATA: data
        run: |
          python tools/fetch_comments.py
          python tools/dm_follow.py || echo "Личные сообщения пропущены"
          python tools/build_map.py

      - name: Автоответы на комментарии (включаются переменной AUTO_REPLY=on)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          AUTO_REPLY: ${{ vars.AUTO_REPLY }}
          AUTO_REPLY_SINCE: ${{ vars.AUTO_REPLY_SINCE }}
        run: python tools/auto_reply.py

      - name: Сохранить, если что-то изменилось
        run: |
          git config user.name "ostrov-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch tools/replied.json tools/dm.json tools/follows.json
          git add tools/residents.json tools/replied.json tools/dm.json tools/follows.json data/residents.json data/polls.json
          if git diff --cached --quiet; then
            echo "Без изменений"
          else
            git commit -m "Жители острова: обновление"
            git pull --rebase --autostash
            git push
          fi
