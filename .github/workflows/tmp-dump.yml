name: tmp-dump
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID || '17841417700837854' }}
          OSTROV_SITE_DATA: /tmp/site
        run: |
          mkdir -p /tmp/site
          python tools/fetch_comments.py > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: comments
          path: tools/comments.json
          retention-days: 1
